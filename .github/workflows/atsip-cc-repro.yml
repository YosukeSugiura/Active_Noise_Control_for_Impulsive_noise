name: ATSIP C_FXLMS reproducibility check
on:
  push:
    branches: [atsip/judge]
    paths: [atsip/explore/cc_repro.py]
  workflow_dispatch:
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt scipy
      - uses: actions/download-artifact@v4
        with:
          name: judge-extra-inputs
          path: atsip/explore/.judge_extra_inputs
          run-id: 45544623677
          github-token: ${{ github.token }}
      - name: Prepare inputs
        working-directory: atsip/explore
        run: |
          mkdir -p data/prepared out
          cp -a .judge_extra_inputs/prepared/. data/prepared/
          tar -xzf results/final2_run.tar.gz -C out
          tar -xzf results/cc_run.tar.gz -C out
      - name: Diagnose
        working-directory: atsip/explore
        run: python cc_repro.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cc-repro
          path: atsip/explore/out/cc_repro.json
